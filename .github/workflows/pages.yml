name: Pages

on:
  push:
    branches: [gamma]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy Gamma Pages
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git imagemagick zip \
            libx11-dev libxext-dev libfreetype6-dev libpng-dev libjpeg-dev \
            pkg-config

      - name: Setup Emscripten
        uses: emscripten-core/setup-emsdk@v15
        with:
          version: 4.0.22

      - name: Build web simulator
        # epsilon.zip is the standalone simulator (simulator.html, epsilon.js and
        # background.jpg). htmlpack.zip only contains the embeddable assets and
        # has no simulator.html, so it cannot be served as-is.
        run: make PLATFORM=simulator TARGET=web epsilon.zip -j"$(nproc)"

      - name: Prepare site
        run: |
          mkdir -p _site/simulator
          cp -R site/. _site/
          unzip -q output/release/simulator/web/epsilon.zip -d _site/simulator
          test -f _site/simulator/simulator.html
          test -f _site/simulator/epsilon.js
          test -f _site/simulator/background.jpg

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
